name: CI/CD pipeline for aws deployment

on:
  workflow_dispatch:
  push:
    paths:
      - "**.js"
      - "**.jsx"
      - "**.ts"
      - "**.tsx"
      - "**.json"
      - "**.md"

jobs:
  build-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run tests (if any)
        run: npm test --if-present

  docker-image-test:
    runs-on: ubuntu-latest
    needs: build-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/portfolio:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/portfolio:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/portfolio:${{ github.ref_name }}

  deploy-aws-eks:
    runs-on: ubuntu-latest
    needs: docker-image-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Setup Kubectl
        uses: azure/setup-kubectl@v4

      - name: Update kubeConfig for EKS
        run: |
          aws eks update-kubeconfig --region ap-south-1 --name hello-cluster

      - name: Verify Connections
        run: kubectl get nodes

      - name: Deploy to AWS (k8s)
        run: |
          kubectl apply -f k8s/
          
